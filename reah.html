<template id="reah-overview-template"><section class="reah-overview" aria-labelledby="overview-title">
<h2 id="overview-title">Reah</h2><p class="overview-summary">Building the brand for one global account — from launch to $600M+ in transaction volume.</p>
<dl class="overview-facts"><div><dt>Role</dt><dd>Art Director &amp; Principal Brand Designer</dd></div><div><dt>Scope</dt><dd>Visual Identity · Motion · 3D · Website &amp; Product UI</dd></div></dl>
<div class="overview-columns"><div><h3>The challenge</h3><p>Global businesses juggle disconnected bank accounts, wallet apps, exchanges, spreadsheets and approval workflows. Reah needed a brand that makes banking and stablecoins feel like one trustworthy system — credible to finance teams, native to crypto teams.</p></div>
<div><h3>The solution</h3><p>We built the brand around one idea: many moving parts, one calm system. A restrained typographic core and a signature colour band give Reah the steadiness finance demands, while 3D forms and motion show money flowing between accounts, wallets and cards — complex underneath, simple on the surface.</p></div></div>
</section></template>
<template id="reah-logo-template"><section class="reah-story reah-logo-module" aria-labelledby="logo-title">
<div class="story-text"><p class="story-label">Logo</p><h2 id="logo-title">One mark for every way your money moves.</h2>
<blockquote class="story-quote"><p>Reah stands for every way your money moves. Four lines curl in from different directions and meet in the middle, and the negative space between them forms a four-pointed star, a spark of intelligence. Drawn with the contrast of a classic serif, it reads like a seal you can trust.</p></blockquote></div>
<figure class="story-media logo-sketches"><img src="./assets/reah/modules/logo-sketches-ipad.webp" width="1143" height="1270" alt="Logo sketches on an iPad: the knot as the final direction, with other explored directions below" loading="lazy" decoding="async"></figure>
</section></template>
<template id="reah-ai-template"><section class="reah-story reah-ai-module" aria-labelledby="ai-title">
<header class="story-intro"><p class="story-label">Designing with AI</p><h2 id="ai-title">Design direction, amplified by AI.</h2><p class="story-lead">AI changed how this brand was made, shared and shipped: the style lives as code, validation is led by design, and motion is scripted.</p></header>
<div class="story-row"><div class="story-text"><p class="story-label">01</p><h3>Style as code</h3><p>Instead of a brand book of swatches and screenshots, the look and feel lives in code. The colour ramp, band spread, sway, grain and line rhythm are measured once and written as parameters in one shared library. The poster, banner, 3D forms and live site all read from the same source.</p><p>Brand assets stop being files to hand around and become a system to version. Change one value and every output follows; any new asset, even a photo, locks to the Reah palette automatically. Consistency is built in, not policed by eye.</p></div>
<figure class="story-media"><img src="./assets/reah/modules/ai-style-as-code.webp" width="1494" height="652" alt="Brand tools for the emboss, gradient and stat posters, all driven by shared parameters" loading="lazy" decoding="async"></figure></div>
<div class="story-row"><div class="story-text"><p class="story-label">02</p><h3>From mockup to live demo</h3><p>AI reshaped the workflow, not just the toolset.</p><p>In the old loop, a large share of the team’s time went into translation: rebuilding mockups in front-end code, design QA rounds, back-and-forth over spacing, states and UI details.</p><p>Now I take designs straight into the live product with AI, and they’re built precisely the first time. The site lives in a shared GitHub repo; the team reviews and comments on the running demo, and every change is a commit anyone can share, roll back and maintain.</p><p>With the detail work handled, the whole team spends its time where it matters: exploring more directions, debating the business logic, and getting the information right.</p></div>
<figure class="story-media"><video data-src="./assets/reah/modules/ai-live-demo.mp4" poster="./assets/reah/modules/ai-live-demo.webp" width="1512" height="852" muted loop playsinline preload="metadata" aria-label="Reviewing and commenting on the running Reah site"></video><figcaption>Design, review and comments happen in the running product</figcaption></figure></div>
<div class="story-row"><div class="story-text"><p class="story-label">03</p><h3>Motion language, scripted</h3><p>With AI I write After Effects scripts and code-driven animation systems to build motion no preset offers: line forms that turn with depth, colour bands that flow, ripples that travel across the brand surface.</p><p>Each effect is a parameter set, so one idea becomes many variations, reused across the site, video and social.</p></div>
<figure class="story-media"><img src="./assets/reah/modules/ai-ae-panels.webp" width="1504" height="890" alt="After Effects script panels for type switching, guides, line text and stripe text" loading="lazy" decoding="async"><figcaption>One script, many variations</figcaption></figure></div>
</section></template>
